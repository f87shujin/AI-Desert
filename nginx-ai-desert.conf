# Nginx configuration for AI Desert Recipe Book
# Place this in /etc/nginx/sites-available/ai-desert
# Then: sudo ln -s /etc/nginx/sites-available/ai-desert /etc/nginx/sites-enabled/

# Configuration for IP-based access (no domain name)
# Access via: http://YOUR_SERVER_IP:80/recipes

server {
    listen 80 default_server;
    server_name _;

    # Your existing site on port 8000 (root path)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI Desert app on port 8001 (accessed via /recipes path)
    location /recipes/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase max upload size for images
        client_max_body_size 10M;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Static files (if you add them later)
    location /recipes/static/ {
        alias /home/yourusername/AI-Desert/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ===================================================================
# Alternative: If you want AI Desert as the ONLY site on this server
# Uncomment this and comment out the above configuration
# Access via: http://YOUR_SERVER_IP
