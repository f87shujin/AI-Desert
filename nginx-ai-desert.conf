# Nginx configuration for AI Desert Recipe Book
# Place this in /etc/nginx/sites-available/ai-desert
# Then: sudo ln -s /etc/nginx/sites-available/ai-desert /etc/nginx/sites-enabled/

# Option 1: Access via subdomain (recommended)
# Access: http://recipes.yourdomain.com
server {
    listen 80;
    server_name recipes.yourdomain.com;

    # Increase max upload size for images
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Static files (if you add them later)
    location /static/ {
        alias /home/yourusername/AI-Desert/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

